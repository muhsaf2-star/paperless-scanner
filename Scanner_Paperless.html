<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan Barcode IMEI / SN</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
.top{background:#087bea;padding:15px;font-weight:700;font-size:18px}
.wrap{max-width:600px;margin:auto}
.camera{position:relative;background:#000;min-height:280px}
#video{width:100%;height:auto;max-height:65vh;object-fit:cover;background:#000}
.line{border:2px solid #fff;border-radius:8px;position:absolute;left:8%;right:8%;top:42%;height:16%;pointer-events:none}
.box{padding:14px}
.status{background:#222;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px}
button,select,input{width:100%;padding:13px;border-radius:9px;font-size:15px}
button{border:0;font-weight:700}
.blue{background:#087bea;color:#fff}
.gray{background:#333;color:#fff;margin-top:8px}
select{display:none;margin-bottom:10px}
.manual{background:#fff;color:#111;margin-top:12px;padding:12px;border-radius:10px}
input{border:1px solid #ccc;margin-top:8px}
</style>
</head>
<body>
<div class="top">📷 Scan Barcode IMEI / SN</div>
<div class="wrap">
  <div class="status" id="status">Tekan MULAI SCAN untuk membuka kamera.</div>

  <select id="cameraSelect" onchange="switchCamera(this.value)"></select>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="line"></div>
  </div>

  <div class="box">
    <button class="blue" onclick="startScanner()">🔄 MULAI SCAN</button>
    <button class="gray" onclick="closePage()">Tutup</button>

    <div class="manual">
      <b>Jika barcode tidak terbaca</b>
      <div style="font-size:12px;margin:6px 0 8px;color:#555">
        Input manual tetap tersedia.
      </div>
      <input id="manual" placeholder="Masukkan IMEI / SN">
      <button class="blue" style="margin-top:8px" onclick="sendResult(document.getElementById('manual').value)">
        GUNAKAN HASIL
      </button>
    </div>
  </div>
</div>

<script>
let reader=null, controls=null, stream=null, selectedDeviceId=null, sent=false;
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const selectEl=document.getElementById('cameraSelect');

function setStatus(x){statusEl.textContent=x}

function stopScanner(){
  try{if(controls)controls.stop()}catch(e){}
  controls=null;
  try{if(reader)reader.reset()}catch(e){}
  reader=null;
  try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}
  stream=null;
}

function isFront(label){
  return /front|user|face|selfie/i.test(label||'');
}

function isBadLens(label){
  return /ultra|ultrawide|wide|0\.5|0,5|macro/i.test(label||'');
}

async function openPermission(){
  // IMPORTANT: this runs only from the user's button tap.
  stream=await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:{exact:'environment'},
      width:{ideal:1920},
      height:{ideal:1080}
    },
    audio:false
  });
  video.srcObject=stream;
  await video.play();
}

async function listRearCameras(){
  const devices=await navigator.mediaDevices.enumerateDevices();
  return devices.filter(d=>d.kind==='videoinput' && !isFront(d.label));
}

function score(d){
  const l=(d.label||'').toLowerCase();
  let s=0;
  if(/back|rear|environment|camera 0|camera 1/.test(l))s+=50;
  if(/main|primary|standard|1x/.test(l))s+=100;
  if(isBadLens(l))s-=200;
  return s;
}

async function startScanner(deviceId=null){
  sent=false;
  stopScanner();

  try{
    setStatus('Meminta akses kamera...');
    if(!deviceId){
      await openPermission();
    }

    const cameras=await listRearCameras();

    if(cameras.length){
      selectEl.innerHTML='';
      cameras.sort((a,b)=>score(b)-score(a));

      cameras.forEach((c,i)=>{
        const o=document.createElement('option');
        o.value=c.deviceId;
        o.textContent=(i===0?'⭐ ':'')+(c.label||('Kamera belakang '+(i+1)));
        selectEl.appendChild(o);
      });

      selectEl.style.display=cameras.length>1?'block':'none';
      selectedDeviceId=deviceId || cameras[0].deviceId;
      selectEl.value=selectedDeviceId;
    }

    reader=new ZXingBrowser.BrowserMultiFormatReader();

    controls=await reader.decodeFromVideoDevice(
      selectedDeviceId,
      'video',
      (result,error)=>{
        if(result && !sent){
          const v=String(result.getText()||'').trim();
          if(v)sendResult(v);
        }
      }
    );

    // If Android exposes logical multi-camera zoom, move away from 0.5x.
    try{
      const track=video.srcObject && video.srcObject.getVideoTracks()[0];
      if(track && track.getCapabilities){
        const c=track.getCapabilities();
        if(c.zoom && Number(c.zoom.max)>=2){
          await track.applyConstraints({advanced:[{zoom:2}]});
        }
      }
    }catch(e){}

    setStatus('SCANNING — arahkan barcode IMEI ke kotak putih.');
  }catch(e){
    console.error(e);
    setStatus('Kamera belum terbuka. Tekan MULAI SCAN lagi. Jika Chrome meminta izin, pilih Izinkan.');
  }
}

async function switchCamera(id){
  if(id) await startScanner(id);
}

function sendResult(value){
  value=String(value||'').trim();
  if(!value || sent)return;
  sent=true;
  stopScanner();

  setStatus('✓ Barcode terbaca: '+value);

  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({type:'PAPERLESS_SCAN_RESULT',value:value},'*');
      setTimeout(()=>window.close(),500);
      return;
    }
  }catch(e){}
}

function closePage(){
  stopScanner();
  try{window.close()}catch(e){}
}
</script>
</body>
</html>
