<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scan IMEI / SN</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
    .top{background:#087bea;padding:15px;font-weight:700;font-size:18px}
    .wrap{max-width:600px;margin:auto}
    #video{width:100%;height:auto;max-height:65vh;object-fit:cover;background:#000}
    .box{padding:14px}
    .status{background:#222;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px}
    .line{border:2px solid #fff;border-radius:8px;position:absolute;left:8%;right:8%;top:42%;height:16%}
    .camera{position:relative;background:#000}
    button{width:100%;padding:13px;border:0;border-radius:9px;font-weight:700;font-size:15px}
    .blue{background:#087bea;color:#fff}
    .gray{background:#333;color:#fff;margin-top:8px}
    .manual{background:#fff;color:#111;margin-top:12px;padding:12px;border-radius:10px}
    input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}
  </style>
</head>
<body>
<div class="top">📷 Scan Barcode IMEI / SN</div>
<div class="wrap">
  <div class="status" id="status">Meminta akses kamera...</div>
  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="line"></div>
  </div>
  <div class="box">
    <button class="blue" onclick="start()">🔄 MULAI SCAN</button>
    <button class="gray" onclick="closePage()">Tutup</button>

    <div class="manual">
      <b>Jika barcode tidak terbaca</b>
      <div style="font-size:12px;margin:6px 0 8px;color:#555">
        Input manual tetap tersedia.
      </div>
      <input id="manual" placeholder="Masukkan IMEI / SN">
      <button class="blue" style="margin-top:8px" onclick="send(document.getElementById('manual').value)">
        GUNAKAN HASIL
      </button>
    </div>
  </div>
</div>

<script>
  let controls = null;
  let reader = null;
  let active = false;
  let sent = false;
  let currentStream = null;

  function setStatus(text){
    document.getElementById('status').textContent = text;
  }

  function stopScanner(){
    active = false;
    try{ if(controls) controls.stop(); }catch(e){}
    controls = null;
    try{ if(reader) reader.reset(); }catch(e){}
    reader = null;
    if(currentStream){
      try{ currentStream.getTracks().forEach(t=>t.stop()); }catch(e){}
      currentStream = null;
    }
  }

  async function startScanner(){
    stopScanner();
    sent = false;
    document.getElementById('result').textContent = '';
    setStatus('Membuka KAMERA UTAMA belakang...');

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus('Browser tidak mendukung kamera. Buka halaman ini langsung di Chrome.');
      return;
    }

    try{
      // IMPORTANT:
      // Do NOT select the last camera device. On many Android phones that is
      // the 0.5x / ultrawide camera. facingMode=environment asks the browser
      // for its normal rear-facing camera.
      reader = new ZXingBrowser.BrowserMultiFormatReader();

      const constraints = {
        video:{
          facingMode:{exact:'environment'},
          width:{ideal:1920},
          height:{ideal:1080},
          frameRate:{ideal:30}
        },
        audio:false
      };

      controls = await reader.decodeFromConstraints(
        constraints,
        'video',
        function(result, error){
          if(result && !sent){
            const text = String(result.getText() || '').trim();
            if(text) sendResult(text);
          }
        }
      );

      active = true;
      setStatus('SCANNING — kamera utama aktif. Dekatkan barcode IMEI ke kotak putih.');

      // After permission, list cameras so user can switch if the phone still
      // chooses an unwanted lens.
      await populateCameraList();

    }catch(e){
      // Fallback: use browser's environment camera without exact constraint.
      try{
        reader = new ZXingBrowser.BrowserMultiFormatReader();

        controls = await reader.decodeFromConstraints(
          {
            video:{
              facingMode:'environment',
              width:{ideal:1920},
              height:{ideal:1080}
            },
            audio:false
          },
          'video',
          function(result, error){
            if(result && !sent){
              const text = String(result.getText() || '').trim();
              if(text) sendResult(text);
            }
          }
        );

        active = true;
        setStatus('SCANNING — kamera belakang aktif.');
        await populateCameraList();
      }catch(err){
        active = false;
        setStatus('Kamera gagal dibuka. Pastikan izin kamera aktif.');
      }
    }
  }

  async function populateCameraList(){
    const select = document.getElementById('cameraSelect');
    if(!select) return;

    try{
      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      if(!devices || devices.length < 2){
        select.style.display = 'none';
        return;
      }

      select.innerHTML = '';

      // Put likely main camera first. Explicitly push ultrawide/wide/0.5x
      // to the bottom so it isn't accidentally selected.
      const ranked = devices.map(function(d){
        const label=(d.label||'').toLowerCase();
        let score=0;

        if(/back|rear|environment|world/.test(label)) score += 50;
        if(/main|primary/.test(label)) score += 40;
        if(/camera 0|camera0/.test(label)) score += 15;

        if(/ultra|ultrawide|wide|0\.5|0,5/.test(label)) score -= 100;
        if(/front|user|face/.test(label)) score -= 200;

        return {d:d,score:score};
      }).sort((a,b)=>b.score-a.score);

      ranked.forEach(function(item, i){
        const opt=document.createElement('option');
        opt.value=item.d.deviceId;

        const label=item.d.label || ('Kamera '+(i+1));
        const isWide=/ultra|ultrawide|wide|0\.5|0,5/i.test(label);
        opt.textContent = isWide ? label+' (hindari untuk barcode)' : label;

        select.appendChild(opt);
      });

      // Show only if multiple cameras are available.
      select.style.display='block';
      select.value=ranked[0].d.deviceId;

    }catch(e){
      select.style.display='none';
    }
  }

  async function switchCamera(deviceId){
    if(!deviceId || sent) return;

    stopScanner();
    sent=false;
    setStatus('Mengganti kamera...');

    try{
      reader = new ZXingBrowser.BrowserMultiFormatReader();

      controls = await reader.decodeFromVideoDevice(
        deviceId,
        'video',
        function(result, error){
          if(result && !sent){
            const text=String(result.getText()||'').trim();
            if(text) sendResult(text);
          }
        }
      );

      active=true;
      setStatus('SCANNING — kamera dipilih. Arahkan ke barcode IMEI.');
    }catch(e){
      setStatus('Kamera tidak dapat digunakan. Pilih kamera lain.');
    }
  }

  function sendResult(value){
    value=String(value||'').trim();
    if(!value || sent) return;

    sent=true;
    stopScanner();

    document.getElementById('result').textContent='✓ '+value;
    setStatus('Barcode terbaca. Mengirim hasil...');

    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage(
          {type:'PAPERLESS_SCAN_RESULT',value:value},
          '*'
        );
        setTimeout(function(){ window.close(); },500);
        return;
      }
    }catch(e){}

    setStatus('Hasil terbaca: '+value);
  }

  function toggleManual(){
    const box=document.getElementById('manualBox');
    box.style.display=box.style.display==='block'?'none':'block';
  }

  window.addEventListener('beforeunload', stopScanner);
  startScanner();
</script>
</body>
</html>
