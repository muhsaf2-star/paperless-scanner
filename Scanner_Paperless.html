<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Live Scan IMEI / SN</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{overflow:hidden}
    .top{height:58px;background:#087bea;display:flex;align-items:center;padding:0 15px;font-size:18px;font-weight:700}
    .wrap{height:calc(100vh - 58px);position:relative;background:#000}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.35),transparent 25%,transparent 75%,rgba(0,0,0,.45))}
    .guide{
      position:absolute;left:7%;right:7%;top:39%;height:22%;
      border:3px solid #fff;border-radius:12px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.12)
    }
    .guide:after{
      content:"";position:absolute;left:0;right:0;top:50%;
      height:2px;background:#087bea;box-shadow:0 0 8px #087bea
    }
    .status{
      position:absolute;left:14px;right:14px;top:15px;
      background:rgba(0,0,0,.72);border-radius:10px;padding:11px;
      text-align:center;font-size:14px
    }
    .bottom{
      position:absolute;left:14px;right:14px;bottom:14px;
      background:rgba(0,0,0,.72);border-radius:12px;padding:12px
    }
    .result{font-size:18px;font-weight:700;word-break:break-all;text-align:center}
    .hint{font-size:12px;text-align:center;margin-top:6px;color:#ddd}
    button{width:100%;border:0;border-radius:9px;padding:12px;font-weight:700;font-size:14px;margin-top:9px}
    .close{background:#fff;color:#111}
    .retry{background:#087bea;color:#fff}
    .manual{background:#222;border:1px solid #555;color:#fff}
    input{width:100%;padding:11px;border-radius:8px;border:1px solid #666;background:#fff;color:#111;font-size:16px}
    .manualBox{display:none;margin-top:8px}
  </style>
</head>
<body>
  <div class="top">📷 Live Scanner IMEI / SN</div>

  <div class="wrap">
    <video id="video" autoplay muted playsinline></video>
    <div class="shade"></div>
    <div class="guide"></div>

    <div id="status" class="status">Membuka kamera...</div>

    <div class="bottom">
      <div id="result" class="result"></div>
      <div id="hint" class="hint">
        Arahkan kotak putih ke barcode IMEI. Tidak perlu foto.
      </div>

      <button class="retry" onclick="startScanner()">🔄 MULAI / ULANG SCAN</button>
      <button class="manual" onclick="toggleManual()">⌨️ Input Manual</button>

      <div id="manualBox" class="manualBox">
        <input id="manual" inputmode="text" placeholder="IMEI / SN">
        <button class="retry" onclick="sendResult(document.getElementById('manual').value)">GUNAKAN HASIL</button>
      </div>

      <button class="close" onclick="window.close()">Tutup Scanner</button>
    </div>
  </div>

<script>
  let controls = null;
  let reader = null;
  let active = false;
  let sent = false;

  function setStatus(text){
    document.getElementById('status').textContent = text;
  }

  function stopScanner(){
    active = false;
    try{ if(controls) controls.stop(); }catch(e){}
    controls = null;
    try{ if(reader) reader.reset(); }catch(e){}
    reader = null;
  }

  async function startScanner(){
    if(active) stopScanner();

    sent = false;
    document.getElementById('result').textContent = '';
    setStatus('Membuka kamera belakang...');

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setStatus('Browser tidak mendukung kamera. Buka Web App langsung di Chrome/Safari.');
      return;
    }

    try{
      // Live scanner. Pakai constraint kamera belakang + resolusi tinggi.
      reader = new ZXingBrowser.BrowserMultiFormatReader();

      const constraints = {
        video:{
          facingMode:{ideal:'environment'},
          width:{ideal:1920},
          height:{ideal:1080}
        },
        audio:false
      };

      setStatus('SCANNING — menyiapkan fokus kamera...');

      controls = await reader.decodeFromConstraints(
        constraints,
        'video',
        function(result, error){
          if(result && !sent){
            const value = String(result.getText() || '').trim();
            if(value) sendResult(value);
          }
        }
      );

      active = true;

      // Optimalkan kamera HP untuk barcode dekat:
      // continuous autofocus + zoom 2x jika tersedia.
      try{
        const video = document.getElementById('video');
        const track = video.srcObject && video.srcObject.getVideoTracks()[0];

        if(track && track.getCapabilities){
          const caps = track.getCapabilities();
          const advanced = [];

          if(Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')){
            advanced.push({focusMode:'continuous'});
          }

          if(caps.zoom && Number(caps.zoom.max) >= 2){
            advanced.push({zoom:2});
          }

          if(advanced.length){
            await track.applyConstraints({advanced:advanced});
          }
        }
      }catch(e){}

      setStatus('SCANNING — fokus otomatis aktif. Arahkan barcode ke kotak putih.');
    }catch(e){
      active = false;
      setStatus(
        'Kamera gagal dibuka. Pastikan izin kamera aktif dan halaman ini dibuka langsung di browser.'
      );
    }
  }

  function sendResult(value){
    value = String(value || '').trim();
    if(!value || sent) return;

    sent = true;
    stopScanner();

    document.getElementById('result').textContent = '✓ ' + value;
    setStatus('Barcode terbaca. Mengirim hasil...');

    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage(
          {type:'PAPERLESS_SCAN_RESULT',value:value},
          window.location.origin
        );
        setTimeout(function(){ window.close(); },500);
        return;
      }
    }catch(e){}

    setStatus('Hasil terbaca: ' + value);
  }

  function toggleManual(){
    const box=document.getElementById('manualBox');
    box.style.display=box.style.display==='block'?'none':'block';
  }

  window.addEventListener('beforeunload', stopScanner);
  startScanner();
</script>
</body>
</html>
